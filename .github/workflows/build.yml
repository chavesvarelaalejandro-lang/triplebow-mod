name: Compilar mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Descomprimir el zip
        run: unzip -q ./*.zip -d proyecto

      - name: Compilar
        working-directory: proyecto/triplebow-forge-1.20.1
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: triplebow-jar
          path: proyecto/triplebow-forge-1.20.1/build/libs/triplebow-1.0.0.jar
